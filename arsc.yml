name: Patch framework-res.apk

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Apktool & Build-Tools
        run: |
          wget -q https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O /usr/local/bin/apktool
          wget -q https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.9.3.jar -O /usr/local/bin/apktool.jar
          chmod +x /usr/local/bin/apktool /usr/local/bin/apktool.jar
          BUILD_TOOLS=$(find $ANDROID_HOME/build-tools -maxdepth 1 | sort -V | tail -n 1)
          echo "$BUILD_TOOLS" >> $GITHUB_PATH

      - name: Download APK from Direct Link
        run: |
          mkdir -p input
          wget -O input/framework-res.apk "https://f2l3.reaperzclub.dpdns.org/xp1cy0q?hash=AgAD3S&dl=1"

      - name: Decode & Modify Framework
        run: |
          apktool if input/framework-res.apk
          apktool d input/framework-res.apk -o decoded_fw

      - name: Rebuild and Align Uncompressed ARSC
        run: |
          apktool b decoded_fw -o unsigned.apk
          unzip -o unsigned.apk resources.arsc -d temp_arsc/
          cp input/framework-res.apk final_framework.apk
          zip -j -0 final_framework.apk temp_arsc/resources.arsc
          zipalign -p -f -v 4 final_framework.apk framework-res-patched.apk

      - name: Upload Patched Framework Artifact
        uses: actions/upload-artifact@v4
        with:
          name: patched-framework
          path: framework-res-patched.apk
          
